.brand b{font-weight:700;font-size:17px;letter-spacing:.5px;direction:ltr}
.ibtn{font:inherit;font-size:13px;color:var(--accent);background:var(--soft);border:0;border-radius:8px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.ibtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{outline:1px solid var(--accent)}
.ibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:8px 16px;border-radius:8px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(15,25,40,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);color:var(--ink);border-radius:14px 14px 0 0;width:100%;max-width:520px;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;direction:rtl}
.sheet h3{margin:0;font-size:17px}
.sheet ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.brand small{color:var(--muted);font-size:13px}
.tools{display:flex;gap:6px}
.tbtn{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 11px;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--accent)}
.tbtn:disabled{opacity:.4;cursor:default}
.trail{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;background:var(--soft);color:var(--ink);border:0;border-radius:6px;padding:3px 9px;cursor:pointer}
.chip b{font-weight:600;color:var(--accent)}
.chip.neg b{color:var(--muted)}
.chip:hover{outline:1px solid var(--accent)}
.qcard{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.qnum{font-size:12px;letter-spacing:.6px;color:var(--muted);display:flex;gap:8px;align-items:center}
.kind{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--soft);border-radius:5px;padding:1px 7px;letter-spacing:.3px}
.qtext{font-weight:600;font-size:clamp(20px,5vw,25px);line-height:1.3;text-wrap:balance;margin:0}
.qtext.test{direction:ltr;text-align:right;font-size:clamp(22px,5.6vw,28px)}
.qhint{font-size:14.5px;color:var(--muted);margin:0;max-width:62ch}
.qpos{font-size:14px;margin:0;max-width:62ch}
.qpos b{color:var(--accent);font-weight:600}
.prop{font-size:12.5px;color:var(--muted)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.ans{font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:15px 10px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.ans:hover{border-color:var(--accent);background:var(--soft)}
.ans:active{transform:scale(.98)}
.ans:focus-visible,.tbtn:focus-visible,.chip:focus-visible,.dx-h:focus-visible,.skip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{font:inherit;font-size:13.5px;color:var(--muted);background:none;border:0;cursor:pointer;justify-self:center;grid-column:1/-1;padding:4px;text-decoration:underline;text-underline-offset:3px}
.flagbox{background:var(--flag-soft);color:var(--flag);border-radius:8px;padding:10px 14px;font-size:14.5px;font-weight:600}
.result h2{font-weight:700;font-size:clamp(21px,5.2vw,26px);line-height:1.25;margin:2px 0 0;text-wrap:balance}
.result .en{color:var(--muted);font-size:14px;direction:ltr;text-align:right}
.result p{margin:0;max-width:62ch}
.sec{display:flex;flex-direction:column;gap:5px}
.sec h3{font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;background:var(--soft);border-radius:6px;padding:2px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.primary{font:inherit;font-weight:600;font-size:15px;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
.ghost{font:inherit;font-size:15px;color:var(--accent);background:transparent;border:1.5px solid var(--accent);border-radius:8px;padding:7px 16px;cursor:pointer}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.refs li{font-size:13px;line-height:1.45;direction:ltr;text-align:left;display:flex;flex-direction:column;gap:1px}
.refs .rk{direction:rtl;text-align:right;font-size:11.5px;font-weight:600;color:var(--accent)}
.refs a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.refs a:hover{border-color:var(--accent)}

/* bottom */
#bottom{background:var(--panel);border-top:1px solid var(--line)}
.ddhead{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}
.ddhead .inner{padding-block:9px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ddtitle{font-weight:700;font-size:15px}
.ddcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ddcount b{color:var(--ink);font-weight:700}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
#dd .inner{padding-block:4px 24px}
.dx{border-bottom:1px solid var(--line);transition:opacity .28s ease,transform .28s ease}
.dx.out{opacity:0;transform:translateX(-16px)}
.dx-h{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;cursor:pointer}
.rank{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.dx-name{font-weight:500;font-size:15px;line-height:1.3}
.dx.top .dx-name{font-weight:700;color:var(--accent)}
.dx-name .fl{color:var(--flag);font-size:11.5px;font-weight:700;margin-inline-start:6px}
.pct{font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.2em;text-align:left}
.meter{grid-column:2/4;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease}
.dx.flag .meter i{background:var(--flag)}
.dx-body{padding:0 32px 14px 0;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.dx-body p{margin:0;max-width:62ch}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.why .ok{color:var(--accent)} .why .no{color:var(--flag)}
.elim-t{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);padding:14px 0 6px}
.elim-t:focus-visible{outline:2px solid var(--accent)}
.elim{display:flex;flex-direction:column}
.elim .e{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px;color:var(--muted);border-bottom:1px dashed var(--line)}
.elim .e span:first-child{text-decoration:line-through;text-decoration-color:var(--line)}
.elim .e span:last-child{font-size:12.5px;text-align:left}
.foot{font-size:12px;color:var(--muted);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  p:{limb:'b!',k_ant:'y!',k_teen:'y!',k_tub:'y!',k_jump:'y'},
  d:'כאב ובליטה על ה-Tibial tuberosity במתבגרים פעילים בשלב גדילה.',
  t:['מישוש ה-Tibial tuberosity','צילום אם יש סימנים לא טיפוסיים'],
  m:'הסבר והרגעה, ניהול עומסים, גמישות ארבע-ראשי.',ev:['GH07']},
 {id:'k_oa',n:'אוסטאוארתריטיס של הברך',en:'Knee osteoarthritis',
  p:{limb:'b!',k_age:'b!',k_stiff:'y',k_trauma:'n',k_pop:'n',k_teen:'n',t_crep:'y'},
  d:'כאב מכני ונוקשות בוקר קצרה מגיל 40–50, עם קרפיטציות והגדלה גרמית. אבחנה קלינית.',
  t:['קרפיטציות','הגדלה גרמית','צילום בעמידה (לא חובה לאבחנה)'],
  m:'תרגול וחיזוק, ירידה במשקל לפי הצורך, הדרכה. NSAIDs מקומיים.',ev:['AL86','BN19']},
 {id:'k_itb',n:'תסמונת ה-ITB',en:'Iliotibial band syndrome',
  p:{limb:'b!',k_ant:'n',k_side:'b!',k_run:'y',k_trauma:'n',t_noble:'y',t_jlt:'n'},
  d:'כאב לטרלי מעל האפיקונדיל בריצה או ברכיבה, שמופיע אחרי מרחק קבוע.',
  t:['Noble compression','Ober','מישוש האפיקונדיל הלטרלי'],
  m:'ניהול עומסי ריצה, חיזוק ירך, התאמת טכניקה וציוד.',ev:['EL07']},
 {id:'k_pes',n:'תסמונת Pes anserine',en:'Pes anserine bursitis / tendinopathy',
  p:{limb:'b!',k_ant:'n',k_side:'a!',k_anser:'y!',k_age:'b',k_trauma:'n',t_valg:'n',t_mcm:'n'},
  d:'כאב מדיאלי מתחת לקו המפרק, שכיח בגיל מבוגר, לעיתים יחד עם OA.',
  t:['מישוש מתחת לקו המפרק המדיאלי','US'],
  m:'ניהול עומסים, חיזוק, הזרקה לשקול.',ev:['HF10']},
 {id:'k_baker',n:'ציסטת בייקר',en:"Popliteal (Baker's) cyst",
  p:{limb:'b!',k_ant:'n',k_post:'y!',k_pswell:'y',t_eff:'y'},
  d:'נפיחות ומלאות מאחורי הברך, לרוב יחד עם OA או קרע במניסקוס. לשלול DVT.',
  t:['מישוש בחלל הברך','US'],
  m:'טיפול בבעיה התוך-מפרקית. התפוצצות עם נפיחות שוק → שלילת DVT.',ev:['FN15']},
];

/* ================= ENGINE ================= */
const QI = Object.fromEntries(Q.map(q=>[q.id,q]));
let answers = [];
let forceDone=false, keepAsking=false, open=new Set(), showElim=false, prevActive=new Set(DX.map(d=>d.id));

function ansLabel(q,v){
  if(v==='?')return 'דילוג';
  if(q.type==='ab')return q.a[v==='a'?0:1];
  if(q.type==='pn')return v==='y'?'חיובי':'שלילי';
  return v==='y'?'כן':'לא';
}
const mod = e => e.length>1 ? e[1] : '';
const weightOf = e => ({'!':2,'*':2,'+':1.5,'-':1.5})[mod(e)]||1;

function evaluate(){
  const A=Object.fromEntries(answers);
  const res=DX.map(d=>{
    let s=0, elim=null, elimQ=null, why=[];
    for(const [qid,v] of answers){
      const e=d.p[qid]; if(!e||v==='?')continue;
      const m=mod(e), x=e[0], q=QI[qid], txt=q.lbl+': '+ansLabel(q,v);
      if(v===x){ s += m==='!'?(d.flag&&!q.scope?6:2): (m==='+'||m==='*')?3:1; if(!q.scope)why.push([1,txt]); }
      else if(m==='!'){ elim=txt; elimQ=qid; break; }
      else { s -= (m==='-'||m==='*')?3:1; why.push([0,txt]); }
    }
    return {d,s,elim,elimQ,why};
  });
  const act=res.filter(r=>!r.elim).sort((a,b)=>b.s-a.s);
  const tot=act.reduce((t,r)=>t+Math.exp(r.s*.6),0);
  act.forEach(r=>r.pct=tot?Math.exp(r.s*.6)/tot:0);
  return {A,act,elim:res.filter(r=>r.elim)};
}

function nextQuestion(ev){
  const asked=new Set(answers.map(a=>a[0]));
  const ok=q=>!asked.has(q.id)&&(!q.cond||Object.entries(q.cond).every(([k,v])=>ev.A[k]===v));
  const cands=Q.filter(ok);
  const firsts=cands.filter(q=>q.first).sort((a,b)=>a.first-b.first);
  let best=null,bv=0;
  for(const q of [...firsts,...cands.filter(q=>!q.first)]){
    let wY=0,wN=0,nY=0,nN=0;
    for(const r of ev.act){
      const e=r.d.p[q.id]; if(!e)continue;
      const w=weightOf(e)*(1+Math.max(0,r.s)*.3);
      if(e[0]==='y'||e[0]==='a'){wY+=w;nY++}else{wN+=w;nN++}
    }
    const neutral=ev.act.length-nY-nN;
    if(nY+nN===0)continue;
    if((nY===0||nN===0)&&neutral===0)continue;
    let v=Math.min(wY,wN)*2+Math.max(wY,wN)*.5;
    if(q.first){ if(v>0)return q; else continue; }
    if(q.type==='pn')v*=.85;  // אנמנזה קודם, בדיקות אחר כך
    if(v>bv){bv=v;best=q}
  }
  return best;
}

/* ================= RENDER ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pub=q=>'https://pubmed.ncbi.nlm.nih.gov/?term='+encodeURIComponent(q);
const refsHTML=ids=>`<ul class="refs">${ids.map(id=>{const r=R[id];return `<li><span class="rk">${esc(r.k)}</span><a href="${pub(r.q)}" target="_blank" rel="noopener">${esc(r.c)}</a></li>`}).join('')}</ul>`;

function testProp(q){
  const codes=DX.map(d=>d.p[q.id]).filter(Boolean).map(mod);
  if(codes.includes('*'))return 'רגישה וספציפית: משפיעה חזק לשני הכיוונים';
  if(codes.includes('+'))return 'ספציפית: תוצאה חיובית מחזקת מאוד';
  if(codes.includes('-'))return 'רגישה: תוצאה שלילית מחלישה מאוד';
  if(codes.includes('!'))return 'בדיקת סינון: תוצאה שלילית שוללת';
  return '';
}

function render(){
  const ev=evaluate(), q=nextQuestion(ev), top=ev.act[0];
  const confident=top&&top.pct>=.9&&top.s>=3&&answers.filter(a=>!QI[a[0]].scope).length>=4&&!(q&&q.first);
  const done=forceDone||!q||ev.act.length<=1||(confident&&!keepAsking);
  renderTop(ev,q,done); renderDD(ev);
}

function renderTop(ev,q,done){
  const flags=ev.act.filter(r=>r.d.flag&&r.why.some(w=>w[0]));
  let h=`<div class="bar"><span class="brand"><span class="logo" aria-hidden="true"></span><b>DD</b><small>כתף · מרפק · ברך</small></span>
    <span class="tools">${canInstall()?`<button class="ibtn" id="install" title="התקנה כאפליקציה"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>התקנה</button>`:''}<button class="ibtn" id="share" title="שיתוף"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>שיתוף</button></span></div>
  <div class="bar" style="justify-content:flex-start"><span class="tools"><button class="tbtn" id="undo" ${answers.length?'':'disabled'}>חזרה</button><button class="tbtn" id="reset" ${answers.length?'':'disabled'}>מההתחלה</button></span></div>`;
  if(answers.length)h+=`<div class="trail">${answers.map(([qid,v],i)=>`<button class="chip ${v==='n'?'neg':''}" data-back="${i}" title="חזרה לשאלה זו">${esc(QI[qid].lbl)}: <b>${esc(ansLabel(QI[qid],v))}</b></button>`).join('')}</div>`;
  if(flags.length)h+=`<div class="flagbox">דגל אדום: ${flags.map(f=>esc(f.d.n)).join(', ')}. נדרש בירור או הפניה לפני טיפול.</div>`;

  if(!done&&q){
    const isT=q.type==='pn';
    const L=q.type==='ab'?q.a:isT?['חיובי','שלילי']:['כן','לא'];
    const V=q.type==='ab'?['a','b']:['y','n'];
    const prop=isT?testProp(q):'';
    h+=`<div class="qcard"><span class="qnum">${isT?'<span class="kind">בדיקה קלינית</span>':''}שאלה ${answers.length+1}</span>
      <h1 class="qtext ${isT?'test':''}">${esc(q.t)}</h1>
      ${q.h?`<p class="qhint">${esc(q.h)}</p>`:''}
      ${q.pos?`<p class="qpos"><b>חיובי:</b> ${esc(q.pos)}</p>`:''}
      ${prop?`<span class="prop">${esc(prop)}</span>`:''}
      <div class="answers" data-q="${q.id}">${L.map((l,i)=>`<button class="ans" data-v="${V[i]}">${esc(l)}</button>`).join('')}${!q.scope?`<button class="skip" data-v="?">${isT?'לא נבדק / דלג':'לא יודע / דלג'}</button>`:''}</div>
      ${answers.length>=3?'<div><button class="tbtn" id="finish">הצג תוצאה עכשיו</button></div>':''}</div>`;
  } else if(!ev.act.length){
    h+=`<div class="qcard result"><h2>אין אבחנה שמתאימה לכל התשובות</h2><p>ייתכן שתשובה אחת סותרת. אפשר לחזור לשאלה מסוימת מהשורה למעלה.</p>
      <div class="row"><button class="primary" id="undo2">חזרה צעד</button></div></div>`;
  } else {
    const r=ev.act[0], d=r.d, more=!!nextQuestion(ev);
    h+=`<div class="qcard result"><span class="qnum">אבחנה מובילה · ${Math.round(r.pct*100)}% התאמה יחסית</span>
      <div><h2>${esc(d.n)}</h2><div class="en">${esc(d.en)}</div></div>
      <p>${esc(d.d)}</p>
      <div class="sec"><h3>מבחנים לאישור</h3><div class="tags">${d.t.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>
      <div class="sec"><h3>כיוון טיפולי</h3><p>${esc(d.m)}</p></div>
      ${ev.act[1]?`<div class="sec"><h3>לשקול גם</h3><p>${ev.act.slice(1,3).map(x=>esc(x.d.n)+' ('+Math.round(x.pct*100)+'%)').join(' · ')}</p></div>`:''}
      <div class="sec"><h3>מקורות</h3>${refsHTML(d.ev)}</div>
      <div class="row">${more?'<button class="ghost" id="more">המשך לשאול</button>':''}<button class="ghost" id="shareRes">שיתוף סיכום</button><button class="primary" id="reset2">מטופל חדש</button></div></div>`;
  }
  h+=`<div class="foot">כלי תומך החלטה לאנשי מקצוע. לא מחליף שיקול דעת קליני.</div>`;
  $('#topInner').innerHTML=h;
}

function renderDD(ev){
  const el=ev.elim.filter(r=>!QI[r.elimQ].scope);
  const pool=ev.act.length+el.length;
  $('#ddcount').innerHTML=`<b>${ev.act.length}</b> מתוך ${pool}`;
  $('#prog').style.width=(pool>1?(1-(ev.act.length-1)/(pool-1))*100:100)+'%';
  const any=answers.length>0;
  let h=ev.act.map((r,i)=>{
    const d=r.d,o=open.has(d.id),pct=Math.round(r.pct*100);
    return `<div class="dx ${d.flag?'flag':''} ${i===0&&any?'top':''}" data-id="${d.id}">
      <button class="dx-h" data-open="${d.id}" aria-expanded="${o}">
        <span class="rank">${i+1}</span>
        <span class="dx-name">${esc(d.n)}${d.flag?'<span class="fl">דגל אדום</span>':''}</span>
        <span class="pct">${any?pct+'%':''}</span>
        <span></span><span class="meter"><i style="width:${any?Math.max(2,pct):100}%"></i></span>
      </button>
      ${o?`<div class="dx-body"><p>${esc(d.d)}</p>
        ${r.why.length?`<ul class="why">${r.why.map(([ok,t])=>`<li class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${esc(t)}</li>`).join('')}</ul>`:''}
        <div class="tags">${d.t.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
        <p><b>טיפול:</b> ${esc(d.m)}</p>
        ${refsHTML(d.ev)}</div>`:''}
    </div>`;
  }).join('');
  if(el.length){
    h+=`<button class="elim-t" id="elimT" aria-expanded="${showElim}">${showElim?'▾':'◂'} נשללו (${el.length})</button>`;
    if(showElim)h+=`<div class="elim">${el.map(r=>`<div class="e"><span>${esc(r.d.n)}</span><span>${esc(r.elim)}</span></div>`).join('')}</div>`;
  }
  $('#ddInner').innerHTML=h;
  prevActive=new Set(ev.act.map(r=>r.d.id));
}

/* ================= ACTIONS ================= */
function answer(qid,v){
  answers.push([qid,v]); keepAsking=false; forceDone=false;
  const now=new Set(evaluate().act.map(r=>r.d.id));
  const leaving=[...prevActive].filter(id=>!now.has(id));
  if(leaving.length&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    leaving.forEach(id=>{const n=document.querySelector(`.dx[data-id="${id}"]`);n&&n.classList.add('out')});
    setTimeout(render,260);
  } else render();
  $('#top').scrollTop=0;
}
function back(i){answers=answers.slice(0,i);forceDone=false;keepAsking=false;render();}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t)return;
  if(t.dataset.v){answer(t.closest('.answers').dataset.q,t.dataset.v);return;}
  if(t.dataset.back!==undefined){back(+t.dataset.back);return;}
  if(t.dataset.open){const id=t.dataset.open;open.has(id)?open.delete(id):open.add(id);renderDD(evaluate());return;}
  switch(t.id){
    case 'undo':case 'undo2':back(answers.length-1);break;
    case 'reset':case 'reset2':answers=[];open.clear();forceDone=false;keepAsking=false;render();break;
    case 'finish':forceDone=true;render();break;
    case 'more':keepAsking=true;forceDone=false;render();break;
    case 'elimT':showElim=!showElim;renderDD(evaluate());break;
    case 'share':shareApp();break;
    case 'shareRes':shareSummary();break;
    case 'install':doInstall();break;
    case 'closeSheet':closeSheet();break;
  }
});
document.addEventListener('keydown',e=>{
  const box=document.querySelector('.answers'); if(!box)return;
  const i={'1':0,'2':1}[e.key]; if(i!==undefined){const b=box.querySelectorAll('.ans')[i];b&&b.click();}
});
/* ================= SHARE / INSTALL ================= */
const appURL=()=>location.href.split('#')[0].split('?')[0];
function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2200);}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg);}catch(e){openSheet('העתקה',`<textarea readonly style="width:100%;min-height:140px;font:inherit;direction:rtl" id="copyBox">${esc(t)}</textarea>`);const b=document.getElementById('copyBox');b&&b.select();}}
async function shareOrCopy(data,copyStr,msg){
  if(navigator.share){try{await navigator.share(data);return;}catch(e){if(e&&e.name==='AbortError')return;}}
  copyText(copyStr,msg);
}
function shareApp(){const u=appURL();shareOrCopy({title:'DD',text:'DD — אבחנה מבדלת אורטופדית לכתף, מרפק וברך',url:u},u,'הקישור הועתק');}
function shareSummary(){
  const ev=evaluate(); if(!ev.act.length)return;
  const lines=['DD · סיכום אבחנה מבדלת',''];
  ev.act.slice(0,3).forEach((r,i)=>lines.push(`${i+1}. ${r.d.n} (${r.d.en}) — ${Math.round(r.pct*100)}%`));
  lines.push('','ממצאים:');
  answers.filter(([q,v])=>v!=='?'&&!QI[q].scope).forEach(([q,v])=>lines.push(`• ${QI[q].lbl}: ${ansLabel(QI[q],v)}`));
  const t=lines.join('\n');
  shareOrCopy({title:'DD — סיכום',text:t},t,'הסיכום הועתק');
}
let deferredPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function canInstall(){return !isStandalone()&&(!!deferredPrompt||isIOS);}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;render();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('DD הותקנה');render();});
async function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;render();return;}
  if(isIOS)openSheet('התקנה באייפון',`<ol><li>פותחים את הדף בספארי.</li><li>לוחצים על כפתור השיתוף בתחתית המסך.</li><li>בוחרים "הוסף למסך הבית".</li></ol>`);
}
function openSheet(title,html){closeSheet();const w=document.createElement('div');w.className='sheet';w.innerHTML=`<div role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${html}<button class="primary" id="closeSheet">סגירה</button></div>`;w.addEventListener('click',e=>{if(e.target===w)closeSheet();});document.body.appendChild(w);}
function closeSheet(){document.querySelectorAll('.sheet').forEach(n=>n.remove());}
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.ai|claudeusercontent/.test(location.host)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
render();
</script>
